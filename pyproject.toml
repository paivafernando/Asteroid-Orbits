[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-orbits"
version = "0.1.0"
description = "Query and filter asteroid orbit records."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]
